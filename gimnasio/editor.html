<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de la página</title>
<style>
  :root {
    --bg: #f4f4f2; --panel: #ffffff; --line: #e3e2dd; --text: #18181a; --muted: #6c6c72; --accent: #18181a; --ok: #1f8a4c;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    font-family: system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #101012; --panel: #18181b; --line: #2a2a2f; --text: #f1f1f0; --muted: #9b9ba1; --accent: #f1f1f0; --ok: #4ad38a; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); height: 100svh; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .top h1 { font-size: 16px; font-weight: 700; margin-right: auto; }
  .top small { color: var(--muted); font-size: 12px; }
  .b { padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); font-size: 14px; font-weight: 600; background: var(--panel); transition: transform 160ms var(--ease-out), background-color 150ms ease; white-space: nowrap; }
  .b:active { transform: scale(0.97); }
  .b.main { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .b.sm { padding: 6px 10px; font-size: 13px; }
  .b.del { color: #d6453d; }
  .layout { display: grid; grid-template-columns: 440px 1fr; min-height: 0; }
  .panel { overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); padding-bottom: 80px; }
  .preview { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  .pbar { display: flex; gap: 6px; justify-content: center; padding: 8px; }
  .pbar .b[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
  .frame { display: grid; place-items: start center; overflow: auto; padding: 0 12px 12px; min-height: 0; }
  iframe { width: 100%; height: 100%; border: 1px solid var(--line); border-radius: 14px; background: #fff; transition: width 300ms var(--ease-out); }
  .frame.mobile iframe { width: 390px; }
  details.sec { border-bottom: 1px solid var(--line); }
  details.sec > summary { list-style: none; cursor: pointer; padding: 16px 18px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary::after { content: "+"; color: var(--muted); font-size: 18px; }
  details.sec[open] > summary::after { content: "–"; }
  details.sec > summary small { font-weight: 500; color: var(--muted); font-size: 12px; margin-left: 8px; margin-right: auto; }
  .body { padding: 0 18px 18px; display: grid; gap: 12px; }
  label.f { display: grid; gap: 5px; font-size: 12px; font-weight: 600; color: var(--muted); }
  input, select, textarea { width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-size: 14px; }
  textarea { resize: vertical; min-height: 70px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .help { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .sw { border-radius: 12px; border: 2px solid transparent; padding: 0; overflow: hidden; text-align: center; font-size: 11px; font-weight: 600; transition: transform 160ms var(--ease-out); }
  .sw:active { transform: scale(0.96); }
  .sw i { display: block; height: 44px; }
  .sw span { display: block; padding: 4px 0; }
  .sw[aria-pressed="true"] { border-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 8px; }
  .row input[type="color"] { width: 46px; height: 38px; padding: 2px; }
  .order { display: grid; gap: 6px; }
  .order .it { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); font-size: 14px; }
  .order .it.off { opacity: .5; }
  .order .it label { display: flex; align-items: center; gap: 8px; margin-right: auto; cursor: pointer; }
  .order input[type="checkbox"] { width: 16px; height: 16px; }
  .mini { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); display: grid; place-items: center; font-size: 13px; }
  .mini:disabled { opacity: .3; cursor: default; }
  .item { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
  .item-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; }
  .ctable { display: grid; gap: 6px; }
  .crow { display: grid; grid-template-columns: 82px 78px 1fr 70px 52px 28px; gap: 5px; align-items: center; }
  .crow input, .crow select { padding: 7px 6px; font-size: 13px; }
  .crow.head { font-size: 11px; font-weight: 700; color: var(--muted); }
  .hrow { display: grid; grid-template-columns: 92px 24px 1fr 1fr; gap: 6px; align-items: center; font-size: 14px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 20px); opacity: 0; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; pointer-events: none;
    transition: opacity 200ms ease, transform 250ms var(--ease-out); z-index: 9; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .tabs-m { display: none; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .tabs-m { display: flex; gap: 6px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
    body { grid-template-rows: auto auto 1fr; }
    .layout[data-view="form"] .preview, .layout[data-view="preview"] .panel { display: none; }
    .pbar { display: none; }
    .frame { padding: 0; } iframe { border: 0; border-radius: 0; }
  }
</style>
</head>
<body>
  <div class="top">
    <h1>Editor de la página <small data-saved></small></h1>
    <button class="b" data-import>Cargar config.js</button>
    <button class="b" data-reset>Volver al original</button>
    <button class="b main" data-export>Descargar config.js</button>
    <input type="file" accept=".js,.json" hidden data-file>
  </div>
  <div class="tabs-m"><button class="b" data-view-btn="form">Editar</button><button class="b" data-view-btn="preview">Vista previa</button></div>
  <div class="layout" data-view="form">
    <div class="panel" data-panel></div>
    <div class="preview">
      <div class="pbar"><button class="b sm" data-device="desktop" aria-pressed="true">Computadora</button><button class="b sm" data-device="mobile" aria-pressed="false">Celular</button></div>
      <div class="frame" data-frame><iframe src="index.html?preview" title="Vista previa" data-iframe></iframe></div>
    </div>
  </div>
  <div class="toast" data-toast></div>

<script src="config.js"></script>
<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const ORIGINAL = JSON.parse(JSON.stringify(window.SITE));
  const KEY = "editor-borrador";
  let st;
  try { st = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  st = st || JSON.parse(JSON.stringify(ORIGINAL));

  const DIAS = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
  const ORDEN = [1, 2, 3, 4, 5, 6, 0];
  const ESTILOS = { neon: ["Neón", "#c6ff3d", "#0b0b0c"], fuego: ["Fuego", "#ff5a1f", "#0b0b0c"], oceano: ["Océano", "#38b6ff", "#0b0b0c"], oro: ["Oro", "#d9a441", "#0b0b0c"], claro: ["Claro", "#ff4d2e", "#f3f2ee"] };
  const TODAS = { portada: "Portada", numeros: "Números", programas: "Programas", horarios: "Horarios de clases", recomendador: "¿Qué plan te conviene?", planes: "Planes y precios",
    coaches: "Coaches", galeria: "Galería", calculadora: "Calculadora de calorías", opiniones: "Opiniones", preguntas: "Preguntas frecuentes", ubicacion: "Ubicación y horario", cierre: "Llamado final" };
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const get = (path) => path.split(".").reduce((o, k) => (o == null ? o : o[k]), st);
  const set = (path, v) => { const ks = path.split("."); const last = ks.pop(); let o = st; for (const k of ks) { if (o[k] == null) o[k] = {}; o = o[k]; } o[last] = v; };

  function ensure() {
    st.negocio ||= {}; st.tema ||= {}; st.portada ||= {}; st.aviso ||= {}; st.horario ||= {}; st.planilla ||= {};
    for (const k of ["secciones", "clases", "planes", "coaches", "feriados", "numeros", "programas", "galeria", "opiniones", "preguntas"]) st[k] ||= [];
  }

  /* ---------- Formulario ---------- */
  const campo = (path, label, type = "text", extra = "") =>
    `<label class="f">${label}<input type="${type}" data-path="${path}" value="${esc(get(path) ?? "")}" ${extra}></label>`;
  const area = (path, label, rows = 3) => `<label class="f">${label}<textarea rows="${rows}" data-path="${path}">${esc(get(path) ?? "")}</textarea></label>`;
  const sec = (title, sub, body, open) => `<details class="sec"${open ? " open" : ""}><summary>${title}<small>${sub}</small></summary><div class="body">${body}</div></details>`;

  function pintar() {
    ensure();
    const abiertos = $$("details.sec").map((d) => d.open);
    const t = st.tema;
    const orden = [...st.secciones.filter((k) => TODAS[k]), ...Object.keys(TODAS).filter((k) => !st.secciones.includes(k))];
    $("[data-panel]").innerHTML = [
      sec("Negocio", "nombre, contacto, ubicación", `
        ${campo("negocio.nombre", "Nombre")}
        ${campo("negocio.eslogan", "Frase principal (portada)")}
        ${area("negocio.descripcion", "Descripción")}
        <div class="g2">${campo("negocio.whatsapp", "WhatsApp", "tel", 'placeholder="5491123456789"')}${campo("negocio.instagram", "Instagram (sin @)")}</div>
        ${campo("negocio.direccion", "Dirección")}
        ${campo("negocio.mapa", "Búsqueda en Google Maps")}
        ${campo("negocio.logo", "Logo (URL de imagen, opcional)", "url")}
        <p class="help">WhatsApp: 549 + característica + número, sin espacios ni +.</p>`, true),
      sec("Estilo", "colores y tipografía", `
        <div class="swatches">${Object.entries(ESTILOS).map(([k, [n, a, b]]) =>
          `<button class="sw" data-estilo="${k}" aria-pressed="${(t.estilo || "neon") === k}"><i style="background:linear-gradient(135deg,${b} 50%,${a} 50%)"></i><span>${n}</span></button>`).join("")}</div>
        <div class="row"><label class="f" style="flex:1">Color principal<input type="color" data-color value="${esc(t.acento || ESTILOS[t.estilo || "neon"][1])}"></label>
          <button class="b sm" data-color-reset style="margin-top:17px">Usar el del estilo</button></div>
        <label class="f">Tipografía de títulos<select data-path="tema.tipografia">
          ${[["impacto", "Impacto (Anton)"], ["moderna", "Moderna (Archivo Black)"], ["condensada", "Condensada (Oswald)"]].map(([v, n]) => `<option value="${v}" ${t.tipografia === v ? "selected" : ""}>${n}</option>`).join("")}
        </select></label>`),
      sec("Secciones", "mostrar, ocultar y ordenar", `<div class="order">${orden.map((k, i) => {
        const on = st.secciones.includes(k);
        return `<div class="it${on ? "" : " off"}"><label><input type="checkbox" data-sec="${k}" ${on ? "checked" : ""}>${TODAS[k]}</label>
          <button class="mini" data-move="${k}" data-dir="-1" ${!on || i === 0 ? "disabled" : ""} aria-label="Subir">↑</button>
          <button class="mini" data-move="${k}" data-dir="1" ${!on || i >= st.secciones.length - 1 ? "disabled" : ""} aria-label="Bajar">↓</button></div>`;
      }).join("")}</div>`),
      sec("Promoción", "barra superior con cuenta regresiva", `
        ${campo("aviso.texto", "Texto (vacío = sin barra)")}
        <div class="g2">${campo("aviso.hasta", "Termina el", "date")}${campo("aviso.link", "Lleva a", "text", 'placeholder="#planes"')}</div>`),
      sec("Portada", "foto, video y etiqueta", `
        ${campo("portada.etiqueta", "Etiqueta superior")}
        ${campo("portada.foto", "Foto de fondo (URL)", "url")}
        ${campo("portada.video", "Video de fondo .mp4 (URL, opcional)", "url")}`),
      sec("Clases", `${st.clases.length} clases`, `
        <div class="ctable"><div class="crow head"><span>Día</span><span>Hora</span><span>Clase</span><span>Coach</span><span>Min</span><span></span></div>
        ${st.clases.map((c, i) => `<div class="crow">
          <select data-list="clases" data-i="${i}" data-k="dia" data-num>${ORDEN.map((d) => `<option value="${d}" ${+c.dia === d ? "selected" : ""}>${DIAS[d].slice(0, 3)}</option>`).join("")}</select>
          <input type="time" data-list="clases" data-i="${i}" data-k="hora" value="${esc(c.hora)}">
          <input data-list="clases" data-i="${i}" data-k="nombre" value="${esc(c.nombre)}" list="disciplinas">
          <input data-list="clases" data-i="${i}" data-k="coach" value="${esc(c.coach)}" list="coaches-list">
          <input type="number" data-list="clases" data-i="${i}" data-k="duracion" data-num value="${esc(c.duracion)}">
          <button class="mini b del" data-del="clases" data-i="${i}" aria-label="Borrar">✕</button></div>`).join("")}</div>
        <datalist id="disciplinas">${[...new Set(st.clases.map((c) => c.nombre))].map((n) => `<option value="${esc(n)}">`).join("")}</datalist>
        <datalist id="coaches-list">${st.coaches.map((c) => `<option value="${esc(c.nombre)}">`).join("")}</datalist>
        <div class="row"><button class="b sm" data-add="clases">+ Agregar clase</button><button class="b sm" data-sort>Ordenar por día y hora</button></div>`),
      sec("Planes", `${st.planes.length} planes`, `
        ${st.planes.map((p, i) => `<div class="item">
          <div class="item-head">Plan ${i + 1}<button class="b sm del" data-del="planes" data-i="${i}">Borrar</button></div>
          <div class="g2"><label class="f">Nombre<input data-list="planes" data-i="${i}" data-k="nombre" value="${esc(p.nombre)}"></label>
            <label class="f">Precio por mes<input type="number" data-list="planes" data-i="${i}" data-k="precio" data-num value="${esc(p.precio)}"></label></div>
          <label class="f">Bajada<input data-list="planes" data-i="${i}" data-k="bajada" value="${esc(p.bajada)}"></label>
          <label class="f">Incluye (uno por línea)<textarea data-list="planes" data-i="${i}" data-k="incluye" data-lines>${esc((p.incluye || []).join("\n"))}</textarea></label>
          <label class="f">Link de pago de Mercado Pago (opcional)<input type="url" data-list="planes" data-i="${i}" data-k="linkPago" value="${esc(p.linkPago)}"></label>
          <label class="row" style="font-size:14px"><input type="checkbox" style="width:16px" data-list="planes" data-i="${i}" data-k="destacado" data-bool ${p.destacado ? "checked" : ""}> Destacar como "Más elegido"</label>
        </div>`).join("")}
        <button class="b sm" data-add="planes">+ Agregar plan</button>
        <div class="g2">${campo("descuentoTrimestral", "Descuento trimestral (%)", "number", "data-num")}${campo("paseDiario", "Pase diario ($, 0 = ocultar)", "number", "data-num")}</div>
        ${campo("mediosDePago", "Medios de pago")}`),
      sec("Horario de atención", "días y feriados", `
        ${ORDEN.map((d) => { const h = st.horario[d]; return `<div class="hrow"><span>${DIAS[d]}</span>
          <input type="checkbox" data-open="${d}" ${h ? "checked" : ""} aria-label="Abierto el ${DIAS[d]}">
          <input type="time" data-h="${d}" data-p="0" value="${h ? h[0] : ""}" ${h ? "" : "disabled"}>
          <input type="time" data-h="${d}" data-p="1" value="${h ? h[1] : ""}" ${h ? "" : "disabled"}></div>`; }).join("")}
        <p class="help" style="margin-top:6px"><b>Feriados y días cerrados</b></p>
        ${st.feriados.map((f, i) => `<div class="g2" style="grid-template-columns:1fr 1fr 28px">
          <input type="date" data-list="feriados" data-i="${i}" data-k="fecha" value="${esc(f.fecha)}">
          <input data-list="feriados" data-i="${i}" data-k="motivo" value="${esc(f.motivo)}" placeholder="Motivo">
          <button class="mini b del" data-del="feriados" data-i="${i}" aria-label="Borrar">✕</button></div>`).join("")}
        <button class="b sm" data-add="feriados">+ Agregar feriado</button>`),
      sec("Coaches", `${st.coaches.length}`, `
        ${st.coaches.map((c, i) => `<div class="item"><div class="item-head">${esc(c.nombre || "Coach")}<button class="b sm del" data-del="coaches" data-i="${i}">Borrar</button></div>
          <div class="g2"><label class="f">Nombre<input data-list="coaches" data-i="${i}" data-k="nombre" value="${esc(c.nombre)}"></label>
          <label class="f">Especialidad<input data-list="coaches" data-i="${i}" data-k="especialidad" value="${esc(c.especialidad)}"></label></div>
          <div class="g2"><label class="f">Foto (URL)<input type="url" data-list="coaches" data-i="${i}" data-k="foto" value="${esc(c.foto)}"></label>
          <label class="f">Instagram<input data-list="coaches" data-i="${i}" data-k="instagram" value="${esc(c.instagram)}"></label></div></div>`).join("")}
        <button class="b sm" data-add="coaches">+ Agregar coach</button>
        <p class="help">El nombre tiene que coincidir con el de las clases para que funcione "Ver sus clases".</p>`),
      sec("Planilla de Google", "el dueño actualiza solo", `
        <p class="help">En Google Sheets: Archivo → Compartir → Publicar en la web → elegí la hoja → CSV. Pegá cada link. Si están cargados, la página usa la planilla en lugar de estos datos.</p>
        ${campo("planilla.clases", "Hoja de clases (dia, hora, clase, coach, duracion)", "url")}
        ${campo("planilla.planes", "Hoja de planes (nombre, precio, bajada, incluye, destacado, linkPago)", "url")}
        ${campo("planilla.aviso", "Hoja de promo (texto, hasta, link)", "url")}`),
      sec("Todo lo demás", "números, programas, galería, opiniones, preguntas", `
        <p class="help">Editá el resto en formato de datos. Respetá comillas y comas; si hay un error, no se aplica.</p>
        <textarea rows="16" data-json style="font-family:ui-monospace,monospace;font-size:12px">${esc(JSON.stringify({
          numeros: st.numeros, programas: st.programas, galeria: st.galeria, opiniones: st.opiniones, puntajeGoogle: st.puntajeGoogle,
          cantidadResenas: st.cantidadResenas, linkResenas: st.linkResenas, preguntas: st.preguntas }, null, 2))}</textarea>
        <p class="help" data-json-msg></p>`),
    ].join("");
    $$("details.sec").forEach((d, i) => { if (abiertos[i] !== undefined) d.open = abiertos[i]; });
  }

  /* ---------- Cambios ---------- */
  let timer;
  function cambio(repintar) {
    if (repintar) pintar();
    clearTimeout(timer);
    timer = setTimeout(() => {
      enviar();
      try { localStorage.setItem(KEY, JSON.stringify(st)); $("[data-saved]").textContent = "· borrador guardado"; } catch (e) {}
    }, 150);
  }
  const panel = $("[data-panel]");
  panel.addEventListener("input", (e) => {
    const el = e.target;
    if (el.dataset.path) { set(el.dataset.path, el.dataset.num !== undefined ? +el.value : el.value); return cambio(); }
    if (el.dataset.list) {
      const item = st[el.dataset.list][+el.dataset.i];
      item[el.dataset.k] = el.dataset.bool !== undefined ? el.checked : el.dataset.num !== undefined ? +el.value : el.dataset.lines !== undefined ? el.value.split("\n").map((x) => x.trim()).filter(Boolean) : el.value;
      return cambio();
    }
    if (el.dataset.color !== undefined) { st.tema.acento = el.value; return cambio(); }
    if (el.dataset.h) { const d = el.dataset.h; st.horario[d][+el.dataset.p] = el.value; return cambio(); }
    if (el.dataset.json !== undefined) {
      try { Object.assign(st, JSON.parse(el.value)); $("[data-json-msg]").textContent = "✓ Aplicado"; cambio(); }
      catch (err) { $("[data-json-msg]").textContent = "Hay un error de formato: " + err.message; }
    }
  });
  panel.addEventListener("change", (e) => {
    const el = e.target;
    if (el.dataset.sec) {
      const k = el.dataset.sec;
      st.secciones = el.checked ? [...st.secciones, k] : st.secciones.filter((x) => x !== k);
      return cambio(true);
    }
    if (el.dataset.open) {
      const d = el.dataset.open;
      st.horario[d] = el.checked ? ["09:00", "21:00"] : null;
      return cambio(true);
    }
    if (el.dataset.bool !== undefined) return;
  });
  panel.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.estilo) { st.tema.estilo = b.dataset.estilo; st.tema.acento = ""; return cambio(true); }
    if (b.dataset.colorReset !== undefined) { st.tema.acento = ""; return cambio(true); }
    if (b.dataset.move) {
      const i = st.secciones.indexOf(b.dataset.move), j = i + +b.dataset.dir;
      [st.secciones[i], st.secciones[j]] = [st.secciones[j], st.secciones[i]];
      return cambio(true);
    }
    if (b.dataset.del) { st[b.dataset.del].splice(+b.dataset.i, 1); return cambio(true); }
    if (b.dataset.add) {
      const nuevo = { clases: { dia: 1, hora: "18:00", nombre: "Funcional", coach: "", duracion: 60 },
        planes: { id: "plan" + Date.now(), nombre: "Nuevo plan", precio: 30000, bajada: "", incluye: ["Musculación libre"], linkPago: "" },
        feriados: { fecha: "", motivo: "Feriado" }, coaches: { nombre: "", especialidad: "", foto: "", instagram: "" } }[b.dataset.add];
      st[b.dataset.add].push(nuevo);
      return cambio(true);
    }
    if (b.dataset.sort !== undefined) {
      const o = (d) => (d === 0 ? 7 : d);
      st.clases.sort((a, c) => o(+a.dia) - o(+c.dia) || String(a.hora).localeCompare(String(c.hora)));
      return cambio(true);
    }
  });

  /* ---------- Vista previa ---------- */
  const iframe = $("[data-iframe]");
  const enviar = () => iframe.contentWindow?.postMessage({ type: "site", site: st }, "*");
  addEventListener("message", (e) => { if (e.data?.type === "preview-ready") enviar(); });
  iframe.addEventListener("load", enviar);
  $$("[data-device]").forEach((b) => b.addEventListener("click", () => {
    $$("[data-device]").forEach((x) => x.setAttribute("aria-pressed", x === b));
    $("[data-frame]").classList.toggle("mobile", b.dataset.device === "mobile");
  }));
  $$("[data-view-btn]").forEach((b) => b.addEventListener("click", () => ($(".layout").dataset.view = b.dataset.viewBtn)));

  /* ---------- Exportar / importar ---------- */
  const toast = (t) => { const el = $("[data-toast]"); el.textContent = t; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 2200); };
  $("[data-export]").addEventListener("click", () => {
    const txt = `/* Configuración de ${st.negocio?.nombre || "la página"} — generada con editor.html.\n   Reemplazá el config.js de la carpeta por este archivo. */\nwindow.SITE = ${JSON.stringify(st, null, 2)};\n`;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([txt], { type: "text/javascript" }));
    a.download = "config.js";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast("Descargado. Reemplazá el config.js de la carpeta por este.");
  });
  $("[data-import]").addEventListener("click", () => $("[data-file]").click());
  $("[data-file]").addEventListener("change", async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      const txt = await f.text();
      const fake = {};
      if (f.name.endsWith(".json")) fake.SITE = JSON.parse(txt);
      else new Function("window", txt)(fake);
      if (!fake.SITE) throw new Error("no encontré window.SITE");
      st = fake.SITE;
      cambio(true);
      toast("Configuración cargada");
    } catch (err) { toast("No se pudo leer el archivo: " + err.message); }
    e.target.value = "";
  });
  $("[data-reset]").addEventListener("click", () => {
    if (!confirm("¿Descartar los cambios y volver al config.js original?")) return;
    st = JSON.parse(JSON.stringify(ORIGINAL));
    try { localStorage.removeItem(KEY); } catch (e) {}
    $("[data-saved]").textContent = "";
    cambio(true);
  });

  pintar();
})();
</script>
</body>
</html>
