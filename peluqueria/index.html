<!doctype html>
<html lang="es" data-modo="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peluquería</title>
<meta name="description" content="Reservá tu turno online.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f5f0e8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fuentes" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../comun/base.css">
<style>
  :root { --accent: #a8824a; --accent-ink: #fff; --accent-soft: rgba(168,130,74,.2); --display: "Cormorant Garamond", "Times New Roman", serif; --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif; }
  [data-modo="claro"] { --bg: #f5f0e8; --surface: #fbf8f3; --surface-2: #efe8dc; --line: #e2d9cb; --text: #1c1915; --muted: #776e63; }
  [data-modo="oscuro"] { --bg: #16130f; --surface: #1f1b16; --surface-2: #2a241d; --line: #3a3229; --text: #f3ece2; --muted: #a89d8e; }
  [data-estilo="rosa"] { --bg: #f8efec; --surface: #fdf8f6; --surface-2: #f1e2dd; --line: #ead6d0; }
  [data-estilo="salvia"] { --bg: #eef0e9; --surface: #f8f9f5; --surface-2: #e2e7dc; --line: #d5dccd; }
  [data-estilo="minimal"] { --bg: #f6f6f4; --surface: #ffffff; --surface-2: #ececea; --line: #e0e0dc; --muted: #6d6d6d; }
  h1, h2, h3, .serif { font-family: var(--display); font-weight: 400; letter-spacing: -.01em; }
  h1 em, h2 em, .serif em { font-style: italic; color: var(--accent); }
  [data-estilo="minimal"] h1 em, [data-estilo="minimal"] h2 em { color: var(--muted); }
  h2 { font-size: clamp(40px, 6vw, 72px); line-height: 1.02; }
  .kicker { font-size: 12px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
  [data-estilo="minimal"] .kicker { color: var(--muted); }
  .logo { font-family: var(--display); font-size: 26px; display: inline-block; }
  .logo img { display: inline-block; vertical-align: middle; }
  .logo em { color: var(--accent); }
  @media (max-width: 600px) { .logo { font-size: 22px; } }
  .btn-dark { background: var(--text); color: var(--bg); }
  .btn-line { border: 1px solid currentColor; }
  @media (hover: hover) and (pointer: fine) { .btn-dark:hover:not(:disabled) { background: var(--accent); color: var(--accent-ink); } .btn-line:hover { background: var(--text); color: var(--bg); border-color: var(--text); } }
  .link { font-size: 13px; font-weight: 700; border-bottom: 1px solid var(--accent); padding-bottom: 1px; transition: color 200ms ease; }
  @media (hover: hover) and (pointer: fine) { .link:hover { color: var(--accent); } }
  details.qa summary::after { color: var(--accent); }

  /* ---------- Portada ---------- */
  .hero { min-height: 100svh; padding: 120px 0 64px; display: grid; align-items: center; }
  .hero .wrap { display: grid; grid-template-columns: 1.05fr .95fr; gap: 56px; align-items: center; }
  .hero h1 { font-size: clamp(54px, 8.2vw, 120px); line-height: .95; margin: 20px 0 26px; }
  .hero h1 .line { display: block; overflow: hidden; padding-bottom: .06em; }
  .hero h1 .line > span { display: block; transform: translateY(110%); animation: lineUp 1100ms var(--ease-out) forwards; }
  .hero h1 .line:nth-child(2) > span { animation-delay: 100ms; }
  .hero h1 .line:nth-child(3) > span { animation-delay: 200ms; }
  .hero p.lead { max-width: 440px; color: var(--muted); font-size: 18px; margin-bottom: 30px; }
  .hero-ctas { display: flex; flex-wrap: wrap; gap: 12px; }
  .proof { display: flex; align-items: center; gap: 12px; margin-top: 28px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
  .proof b { font-family: var(--display); font-size: 32px; font-weight: 500; color: var(--text); line-height: 1; }
  .stars { color: var(--accent); letter-spacing: 2px; }
  .next-free { margin-top: 10px; font-size: 14px; }
  .next-free b { font-weight: 600; }
  .hero-visual { position: relative; aspect-ratio: 4/5; }
  .arch { position: absolute; inset: 0; border-radius: 999px 999px 24px 24px; overflow: hidden;
    background: radial-gradient(60% 50% at 50% 30%, color-mix(in srgb, var(--accent) 45%, #fff), transparent 70%), linear-gradient(170deg, color-mix(in srgb, var(--accent) 50%, #fff), color-mix(in srgb, var(--accent) 70%, #000) 75%);
    clip-path: inset(100% 0 0 0 round 999px 999px 24px 24px); animation: archIn 1400ms var(--ease-in-out) 200ms forwards; }
  .arch img { transform: scale(1.12); animation: settle 1800ms var(--ease-out) 200ms forwards; }
  .seal { position: absolute; left: -36px; bottom: 48px; width: 132px; height: 132px; border-radius: 50%; background: var(--text); color: var(--bg); display: grid; place-items: center;
    opacity: 0; animation: rise 900ms var(--ease-out) 900ms forwards; }
  .seal svg { position: absolute; inset: 0; width: 100%; height: 100%; animation: spin 22s linear infinite; }
  .seal b { font-family: var(--display); font-size: 32px; font-weight: 400; color: var(--accent); }
  [data-estilo="minimal"] .seal b { color: var(--bg); }
  .intro { opacity: 0; animation: rise 900ms var(--ease-out) forwards; }
  .d1 { animation-delay: 350ms; } .d2 { animation-delay: 450ms; } .d3 { animation-delay: 550ms; }
  @keyframes lineUp { to { transform: none; } }
  @keyframes archIn { to { clip-path: inset(0 0 0 0 round 999px 999px 24px 24px); } }
  @keyframes settle { to { transform: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 900px) { .hero .wrap { grid-template-columns: 1fr; gap: 40px; } .hero-visual { max-width: 400px; width: 100%; margin-inline: auto; } .seal { left: 0; width: 104px; height: 104px; } }

  main > section { padding: 112px 0 0; }
  main > section:last-child { padding-bottom: 112px; }
  main > section.hero { padding: 120px 0 64px; }
  main > section.band { margin-top: 112px; padding: 96px 0; background: var(--surface-2); }
  main > section.band + section { padding-top: 96px; }
  .head { display: flex; flex-wrap: wrap; gap: 20px 32px; justify-content: space-between; align-items: flex-end; margin-bottom: 48px; }
  .head h2 { margin-top: 14px; }
  .head p { max-width: 400px; color: var(--muted); }

  /* ---------- Menú de servicios ---------- */
  .menu-bar { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .cats { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .cats .chip { flex: none; }
  .cats .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .search { position: relative; flex: 1; max-width: 300px; min-width: 200px; }
  .search input { width: 100%; padding: 11px 16px 11px 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-size: 15px; }
  .search input:focus { outline: none; border-color: var(--accent); }
  .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
  .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 0 64px; }
  .svc { display: grid; grid-template-columns: 1fr auto; gap: 2px 20px; padding: 22px 0; border-bottom: 1px solid var(--line); animation: rise 400ms var(--ease-out) both; animation-delay: var(--d, 0ms); }
  .svc h3 { font-size: 27px; line-height: 1.2; }
  .svc .price { font-family: var(--display); font-size: 26px; color: var(--accent); white-space: nowrap; text-align: right; }
  [data-estilo="minimal"] .svc .price { color: var(--text); }
  .svc .price small { font-family: var(--body); font-size: 12px; color: var(--muted); display: block; line-height: 1; }
  .svc p { color: var(--muted); font-size: 15px; }
  .svc .meta { display: flex; gap: 14px; align-items: center; justify-content: flex-end; }
  .svc .dur { font-size: 13px; color: var(--muted); white-space: nowrap; }
  @media (max-width: 860px) { .menu { grid-template-columns: 1fr; } .search { max-width: none; } }

  /* ---------- Reserva ---------- */
  .book { display: grid; grid-template-columns: 1fr 370px; gap: 24px; align-items: start; }
  .book > * { min-width: 0; }
  .step { padding: 26px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); margin-bottom: 14px; transition: opacity 250ms ease; }
  .step.locked { opacity: .45; pointer-events: none; }
  .step-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; row-gap: 4px; }
  .step-head b { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 13px; background: var(--surface-2); color: var(--text); transition: background-color 250ms ease, color 250ms ease; }
  .step.done .step-head b { background: var(--accent); color: var(--accent-ink); }
  .step-head h3 { font-size: 26px; }
  .step-head small { margin-left: auto; color: var(--muted); font-size: 13px; }
  .sub-q { text-align: left; margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--line); }
  .sub-q p { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
  .pick button { text-align: left; padding: 13px 15px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg);
    transition: background-color 200ms ease, border-color 200ms ease, color 200ms ease, transform 160ms var(--ease-out); }
  .pick button:active:not(:disabled) { transform: scale(0.98); }
  .pick button strong { display: block; font-size: 15px; font-weight: 600; }
  .pick button span { font-size: 13px; color: var(--muted); }
  .pick button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .pick button[aria-pressed="true"] span { color: inherit; opacity: .7; }
  .pick button:disabled { opacity: .4; }
  @media (hover: hover) and (pointer: fine) { .pick button:hover:not(:disabled):not([aria-pressed="true"]) { border-color: var(--accent); } }
  .days { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 4px; }
  .days::-webkit-scrollbar { display: none; }
  .day { position: relative; flex: none; width: 70px; padding: 11px 0 13px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); text-align: center;
    transition: background-color 200ms ease, border-color 200ms ease, color 200ms ease, transform 160ms var(--ease-out); }
  .day:active:not(:disabled) { transform: scale(0.97); }
  .day small { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .day strong { font-family: var(--display); font-size: 28px; font-weight: 500; line-height: 1.1; }
  .day em { position: absolute; left: 0; right: 0; bottom: 3px; font-style: normal; font-size: 10px; font-weight: 700; color: var(--warn); }
  .day[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .day[aria-pressed="true"] small { color: inherit; opacity: .7; }
  .day:disabled { opacity: .3; }
  .day:disabled strong { text-decoration: line-through; }
  .slots-group + .slots-group { margin-top: 16px; }
  .slots-group p { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
  .slot { padding: 11px 0; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; font-variant-numeric: tabular-nums;
    transition: background-color 200ms ease, border-color 200ms ease, color 200ms ease, transform 160ms var(--ease-out); }
  .slot:active { transform: scale(0.96); }
  .slot[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .hint { color: var(--muted); font-size: 14px; }
  .check { display: flex; gap: 10px; align-items: center; font-size: 15px; cursor: pointer; }
  .check input { width: 20px; height: 20px; accent-color: var(--accent); }
  .summary { position: sticky; top: 96px; padding: 26px; border-radius: var(--radius); background: var(--text); color: var(--bg); }
  .summary h3 { font-size: 30px; margin-bottom: 16px; }
  .sum-list { display: grid; gap: 9px; font-size: 14px; margin-bottom: 16px; min-height: 40px; }
  .sum-row { display: flex; justify-content: space-between; gap: 12px; }
  .sum-row span:first-child { opacity: .65; }
  .sum-row span:last-child { text-align: right; font-weight: 600; }
  .sum-row.disc span:last-child { color: color-mix(in srgb, var(--accent) 70%, var(--bg)); }
  .total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 14px; border-top: 1px solid color-mix(in srgb, var(--bg) 20%, transparent); margin-bottom: 16px; }
  .total strong { font-family: var(--display); font-size: 40px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
  .total small { opacity: .65; font-size: 13px; }
  .missing { font-size: 13px; opacity: .7; text-align: center; margin-top: 10px; }
  @media (max-width: 960px) { .book { grid-template-columns: 1fr; } .summary { position: static; } }
  @media (max-width: 600px) { .step { padding: 20px 16px; } .step-head small { width: 100%; margin-left: 44px; } .pick { grid-template-columns: 1fr; } }

  /* ---------- Combos ---------- */
  .combos { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 16px; }
  .combo { display: flex; flex-direction: column; gap: 8px; padding: 28px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); position: relative; overflow: hidden; }
  .combo .off { position: absolute; top: 18px; right: 18px; font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); }
  .combo h3 { font-size: 32px; line-height: 1.1; padding-right: 60px; }
  .combo p { color: var(--muted); font-size: 15px; }
  .combo ul { list-style: none; font-size: 14px; display: grid; gap: 4px; margin: 6px 0 10px; }
  .combo li::before { content: "+ "; color: var(--accent); font-weight: 700; }
  .combo .prices { display: flex; align-items: baseline; gap: 10px; margin-top: auto; }
  .combo .prices s { color: var(--muted); font-size: 15px; }
  .combo .prices strong { font-family: var(--display); font-size: 36px; font-weight: 500; }
  .combo .btn { margin-top: 12px; }

  /* ---------- Trabajos / galería ---------- */
  .works { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .works figcaption { margin-top: 12px; color: var(--muted); font-size: 14px; text-align: center; }
  .gallery { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
  .shot { position: relative; aspect-ratio: 3/4; border-radius: 18px; overflow: hidden; background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 40%, var(--surface-2)), var(--surface-2)); }
  .shot img { transition: transform 800ms var(--ease-out); }
  @media (hover: hover) and (pointer: fine) { .shot:hover img { transform: scale(1.04); } }
  .shot span { position: absolute; left: 14px; bottom: 12px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
  @media (max-width: 760px) { .gallery { grid-template-columns: 1fr 1fr; } }

  /* ---------- Equipo ---------- */
  .team { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; }
  .member .photo { position: relative; aspect-ratio: 4/5; border-radius: 999px 999px 18px 18px; overflow: hidden; margin-bottom: 18px; display: grid; place-items: center;
    background: linear-gradient(170deg, color-mix(in srgb, var(--accent) 35%, var(--surface-2)), color-mix(in srgb, var(--accent) 60%, #000)); }
  .member .photo span { font-family: var(--display); font-size: 80px; color: rgba(255,255,255,.85); }
  .member .photo img { position: absolute; inset: 0; }
  .member h3 { font-size: 30px; }
  .member p { color: var(--muted); font-size: 14px; }
  .member .days-txt { font-size: 13px; margin: 4px 0 12px; }

  /* ---------- Fidelidad ---------- */
  .loyal { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
  .stamp-card { padding: clamp(24px, 4vw, 36px); border-radius: 24px; background: var(--text); color: var(--bg); box-shadow: 0 30px 60px -24px rgba(0,0,0,.35); }
  .stamp-card .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 22px; }
  .stamp-card .top .serif { font-size: 26px; }
  .stamps { display: grid; grid-template-columns: repeat(auto-fit, minmax(54px, 1fr)); gap: 10px; }
  .stamp { aspect-ratio: 1; border-radius: 50%; border: 1.5px dashed color-mix(in srgb, var(--bg) 40%, transparent); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
  .stamp.on { border-style: solid; background: color-mix(in srgb, var(--bg) 12%, transparent); animation: rise 500ms var(--ease-out) both; animation-delay: var(--d); }
  .stamp.gift { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-size: 11px; line-height: 1.1; padding: 4px; }
  .stamp.gift span { text-align: center; }
  .loyal p { color: var(--muted); font-size: 17px; margin: 18px 0 24px; max-width: 440px; }
  @media (max-width: 860px) { .loyal { grid-template-columns: 1fr; gap: 28px; } }

  /* ---------- Gift card ---------- */
  .gift { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
  .gcard { aspect-ratio: 1.6; border-radius: 22px; padding: clamp(22px, 4vw, 36px); display: flex; flex-direction: column; justify-content: space-between; color: #fbf8f3;
    background: radial-gradient(90% 120% at 100% 0%, color-mix(in srgb, var(--accent) 45%, transparent), transparent 55%), linear-gradient(135deg, #2a231b, #12100c); box-shadow: 0 30px 60px -20px rgba(22,19,15,.45); }
  .gcard .top { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
  .gcard .brand { font-family: var(--display); font-size: 24px; }
  .gcard .amt { font-family: var(--display); font-size: clamp(36px, 5vw, 52px); color: color-mix(in srgb, var(--accent) 60%, #fff); line-height: 1; }
  .gcard .to { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; opacity: .8; }
  .gcard .msg { font-family: var(--display); font-style: italic; font-size: 19px; min-height: 1.4em; }
  .amounts { margin: 18px 0 22px; }
  .amounts .opt[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  @media (max-width: 860px) { .gift { grid-template-columns: 1fr; gap: 32px; } }

  /* ---------- Opiniones / FAQ ---------- */
  .quotes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .quote { padding: 30px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
  .quote .stars { margin-bottom: 12px; }
  .quote p { font-family: var(--display); font-size: 22px; line-height: 1.35; margin-bottom: 18px; }
  .quote figcaption { font-size: 13px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .faq { display: grid; grid-template-columns: .8fr 1.2fr; gap: 48px; }
  @media (max-width: 860px) { .faq { grid-template-columns: 1fr; gap: 24px; } }
  .info { background: var(--text); color: var(--bg); border: 0; }
  .info h3 { color: var(--accent); }
  .info .hours td { border-color: color-mix(in srgb, var(--bg) 18%, transparent); }
  .info .hours td:last-child { color: inherit; opacity: .7; }
  .info .hours tr.today td:last-child { opacity: 1; }
  .info .btn-line { color: var(--bg); }
  [data-modo="oscuro"] .map iframe { filter: invert(.9) hue-rotate(180deg) saturate(.6); }
  [data-modo="claro"] .map iframe { filter: sepia(.25) saturate(.85); }
  .sheet h2 { font-size: 40px; }

  @media (prefers-reduced-motion: reduce) {
    .hero h1 .line > span, .intro, .seal, .svc, .stamp.on { animation: none; opacity: 1; transform: none; }
    .arch { animation: none; clip-path: none; } .arch img { animation: none; transform: none; } .seal svg { animation: none; }
  }
</style>
</head>
<body>
  <div data-aviso></div>
  <header class="nav" id="nav">
    <div class="wrap">
      <a href="#" class="logo" data-logo></a>
      <nav class="nav-links" aria-label="Secciones" data-navlinks></nav>
      <span class="status" data-status><i></i>…</span>
      <a href="#turnos" class="btn btn-dark">Pedir turno</a>
    </div>
  </header>

  <main data-main></main>

  <footer><div class="wrap"><span class="logo" data-logo></span><span data-address></span><a data-instagram target="_blank" rel="noopener"></a><span>© <span data-year></span></span></div></footer>

  <a class="wa-float" data-wa-link="Hola! Quería hacer una consulta" aria-label="Escribinos por WhatsApp" data-icon="wa"></a>
  <div class="dock" data-dock>
    <a href="#turnos" class="btn btn-dark">Pedir turno</a>
    <a class="btn btn-ghost" data-directions target="_blank" rel="noopener" aria-label="Cómo llegar" data-icon="pin"></a>
    <a class="btn btn-wa" data-wa-link="Hola! Quería hacer una consulta" aria-label="WhatsApp" data-icon="wa"></a>
  </div>

  <dialog class="sheet" data-done-modal aria-labelledby="done-title">
    <div class="sheet-in">
      <div class="done">
        <div class="ok">✓</div>
        <h2 id="done-title">¡Pedido enviado!</h2>
        <p data-done-text></p>
        <a class="btn btn-mp" data-sena target="_blank" rel="noopener" hidden></a>
